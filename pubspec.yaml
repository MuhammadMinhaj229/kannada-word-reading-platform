name: padalab_android
description: Offline-first Kannada word-reading assessment for Android tablets.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  file_picker: ^13.3.2
  file_saver: ^0.7.0
  excel_plus: ^2.29.2
  shared_preferences: ^2.5.6
  in_app_update: ^5.0.0
  path: ^1.9.1
  sqflite_sqlcipher: ^3.4.1
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.7+1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada.ttf
