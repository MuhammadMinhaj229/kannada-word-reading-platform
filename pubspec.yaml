name: padalab_android
description: Offline-first Kannada word-reading assessment for Android tablets.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  csv: ^8.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.2
  file_saver: ^0.7.0
  excel_plus: ^2.29.2
  in_app_update: ^5.0.0
  path: ^1.9.1
  sqflite_sqlcipher: ^3.4.1
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

# sqflite_common_ffi is used only by host-side database tests. On Linux CI,
# use the runner's system SQLite instead of downloading an unrelated upstream
# sqlite3 test binary; the production Android app uses sqflite_sqlcipher.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.7+1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/item_bank/selected_words_list_v1.csv
    - assets/item_bank/nonword_candidate_summary_v1.json
    - assets/item_bank/nonword_candidates_supplied_v1.csv
    - assets/item_bank/allocation_proposal_v2.json
    - assets/audio/audio_manifest.json
  fonts:
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada.ttf
