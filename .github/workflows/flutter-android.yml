name: Flutter quality and platform build validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Format, analyze, test and build Android and Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate Android and Web host projects
        run: flutter create . --platforms=android,web --org org.phfi.cdlr --project-name padalab_android --no-pub

      - name: Harden generated Android host
        run: bash scripts/deploy/configure_android_project.sh

      - name: Upload generated Android and Web platform scaffolds
        uses: actions/upload-artifact@v4
        with:
          name: padalab-android-web-platform-scaffold
          path: |
            android/
            web/
          if-no-files-found: error
          retention-days: 7

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate deployment scripts
        run: bash -n scripts/deploy/*.sh

      - name: Canonical Dart formatting
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          git diff --check

      - name: Upload canonical formatted source
        uses: actions/upload-artifact@v4
        with:
          name: padalab-formatted-source
          path: |
            lib/
            test/
          if-no-files-found: error
          retention-days: 7

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=PADALAB_DEMO_MODE=true

      - name: Build release-mode safety candidate
        run: flutter build apk --release --dart-define=PADALAB_DEMO_MODE=false

      - name: Build Flutter Web
        run: flutter build web --release --base-href /

      - name: Configure and verify Flutter Web metadata
        run: |
          bash scripts/deploy/configure_flutter_web.sh build/web
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -d build/web/assets
          test -s build/web/manifest.json
          ! grep -q "A new Flutter project" build/web/index.html build/web/manifest.json

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: padalab-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Flutter Web validation build
        uses: actions/upload-artifact@v4
        with:
          name: padalab-flutter-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 7
