name: Flutter quality and platform build validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"
      - "docs/android-installation.md"
      - "assets/**"
      - ".github/workflows/release-apk.yml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"
      - "docs/android-update-policy.md"
      - "docs/offline-validation.md"
      - "docs/deployment.md"
      - "web/**"
      - "e2e/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"
      - "docs/android-installation.md"
      - "assets/**"
      - ".github/workflows/release-apk.yml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"
      - "docs/android-update-policy.md"
      - "docs/offline-validation.md"
      - "docs/deployment.md"
      - "web/**"
      - "e2e/**"
      - "package.json"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Format, analyze, test and build Android and Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Prepare verified offline Kannada font
        run: bash scripts/deploy/prepare_assets.sh

      - name: Generate Android and Web host projects
        run: flutter create . --platforms=android,web --org org.phfi.cdlr --project-name padalab_android --no-pub

      - name: Harden generated Android host
        run: bash scripts/deploy/configure_android_project.sh

      - name: Pin official Gradle binary distribution and checksum
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          test -s "$WRAPPER"
          python3 - "$WRAPPER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = [
              line for line in path.read_text(encoding="utf-8").splitlines()
              if not line.startswith("distributionUrl=")
              and not line.startswith("distributionSha256Sum=")
          ]
          # Pin the Gradle 9.3.1 version generated by Flutter 3.47.9,
          # but fetch it from Gradle's official host and verify its published
          # checksum independently (gradle.org/release-checksums/).
          lines.extend([
              "distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip",
              "distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06",
          ])
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          grep -Fq 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip' "$WRAPPER"
          grep -Fq 'distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06' "$WRAPPER"
      - name: Resolve dependencies
        run: |
          flutter pub get
          git diff -- pubspec.lock
          git diff --exit-code -- pubspec.lock

      - name: Validate deployment scripts and Vercel security configuration
        run: |
          bash -n scripts/deploy/*.sh
          python3 scripts/deploy/validate_vercel_config.py

      - name: Canonical Dart formatting
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          git diff --check

      - name: Upload canonical formatted source
        uses: actions/upload-artifact@v7
        with:
          name: padalab-formatted-source
          path: |
            lib/
            test/
            pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build ARM64 Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Android build attempt $attempt/$max_attempts"
            if flutter build apk --debug --target-platform android-arm64; then
              exit 0
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Android build failed after $max_attempts attempts." >&2
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Build failed; retrying after ${delay}s to tolerate transient dependency/CDN errors."
            sleep "$delay"
          done

      - name: Build Flutter Web
        run: flutter build web --release --base-href /

      - name: Configure and verify Flutter Web metadata
        run: |
          bash scripts/deploy/configure_flutter_web.sh build/web
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -d build/web/assets
          test -s build/web/manifest.json
          test -s build/web/service-worker.js
          test -s build/web/app-release.json
          grep -q 'navigator.serviceWorker.register' build/web/index.html
          ! grep -q "A new Flutter project" build/web/index.html build/web/manifest.json
          python3 scripts/deploy/validate_flutter_web_output.py build/web

      - name: Set up Node.js for Playwright browser tests
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium chrome

      - name: Run Flutter Web browser and offline smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory build/web >/tmp/padalab-web-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          CI=1 npm run test:e2e
          mkdir -p artifacts
          cp /tmp/padalab-web-server.log artifacts/ 2>/dev/null || true

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: padalab-playwright-diagnostics
          path: |
            test-results/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify ARM64 APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"

          ABI_LIST="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)"
          if [[ "$ABI_LIST" != "arm64-v8a" ]]; then
            echo "Expected only arm64-v8a native libraries; found:" >&2
            printf '%s\n' "$ABI_LIST" >&2
            unzip -Z1 "$APK" | grep '^lib/' >&2 || true
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          stat --printf='ARM64 debug APK size: %s bytes\n' "$APK"

      - name: Upload ARM64 Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: padalab-android-arm64-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Flutter Web validation build
        uses: actions/upload-artifact@v7
        with:
          name: padalab-flutter-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  publish-preview-apk:
    name: Publish latest main engineering-preview APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated ARM64 APK artifact
        uses: actions/download-artifact@v8
        with:
          name: padalab-android-arm64-debug-apk
          path: staging

      - name: Prepare stable preview release assets
        shell: bash
        run: |
          set -euo pipefail
          APK="release/padalab-android-arm64-debug.apk"
          mkdir -p release
          cp staging/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          test -s "$APK"
          test -s "$APK.sha256"

      - name: Move preview tag to this validated main commit
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = 'padalab-preview';
            const ref = 'tags/' + tagName;

            // GitHub's update-ref endpoint can return 422 for a missing ref
            // (rather than 404). Discover the exact ref first, then choose
            // create or update explicitly instead of interpreting error codes.
            const matches = await github.rest.git.listMatchingRefs({
              owner, repo, ref
            });
            const existing = matches.data.find(
              item => item.ref === 'refs/' + ref
            );

            if (existing) {
              await github.rest.git.updateRef({
                owner, repo, ref, sha: context.sha, force: true
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/' + ref, sha: context.sha
              });
            }

      - name: Publish or refresh the stable preview APK release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: padalab-preview
          name: PadLab Android Preview — main
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          files: |
            release/padalab-android-arm64-debug.apk
            release/padalab-android-arm64-debug.apk.sha256
