name: Flutter quality and platform build validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"
      - "docs/android-installation.md"
      - "assets/**"
      - ".github/workflows/release-apk.yml"
      - "README.md"
      - "docs/android-update-policy.md"
      - "docs/offline-validation.md"
      - "docs/deployment.md"
      - "web/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"
      - "docs/android-installation.md"
      - "assets/**"
      - ".github/workflows/release-apk.yml"
      - "README.md"
      - "docs/android-update-policy.md"
      - "docs/offline-validation.md"
      - "docs/deployment.md"
      - "web/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Format, analyze, test and build Android and Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Prepare verified offline Kannada font
        run: bash scripts/deploy/prepare_assets.sh

      - name: Generate Android and Web host projects
        run: flutter create . --platforms=android,web --org org.phfi.cdlr --project-name padalab_android --no-pub

      - name: Harden generated Android host
        run: bash scripts/deploy/configure_android_project.sh

      - name: Resolve dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Validate deployment scripts and Vercel security configuration
        run: |
          bash -n scripts/deploy/*.sh
          python3 scripts/deploy/validate_vercel_config.py

      - name: Canonical Dart formatting
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          git diff --check

      - name: Upload canonical formatted source
        uses: actions/upload-artifact@v7
        with:
          name: padalab-formatted-source
          path: |
            lib/
            test/
            pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build ARM64 Android debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build Flutter Web
        run: flutter build web --release --base-href /

      - name: Configure and verify Flutter Web metadata
        run: |
          bash scripts/deploy/configure_flutter_web.sh build/web
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -d build/web/assets
          test -s build/web/manifest.json
          test -s build/web/service-worker.js
          test -s build/web/app-release.json
          grep -q 'navigator.serviceWorker.register' build/web/index.html
          ! grep -q "A new Flutter project" build/web/index.html build/web/manifest.json
          python3 scripts/deploy/validate_flutter_web_output.py build/web

      - name: Verify ARM64 APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"

          ABI_LIST="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)"
          if [[ "$ABI_LIST" != "arm64-v8a" ]]; then
            echo "Expected only arm64-v8a native libraries; found:" >&2
            printf '%s\n' "$ABI_LIST" >&2
            unzip -Z1 "$APK" | grep '^lib/' >&2 || true
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          stat --printf='ARM64 debug APK size: %s bytes\n' "$APK"

      - name: Upload ARM64 Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: padalab-android-arm64-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Flutter Web validation build
        uses: actions/upload-artifact@v7
        with:
          name: padalab-flutter-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  publish-preview-apk:
    name: Publish latest main engineering-preview APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the validated ARM64 APK artifact
        uses: actions/download-artifact@v7
        with:
          name: padalab-android-arm64-debug-apk
          path: staging

      - name: Prepare stable preview release assets
        shell: bash
        run: |
          set -euo pipefail
          APK="release/padalab-android-arm64-debug.apk"
          mkdir -p release
          cp staging/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          test -s "$APK"
          test -s "$APK.sha256"

      - name: Move preview tag to this validated main commit
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = 'padalab-preview';
            const ref = 'tags/' + tagName;

            // GitHub's update-ref endpoint can return 422 for a missing ref
            // (rather than 404). Discover the exact ref first, then choose
            // create or update explicitly instead of interpreting error codes.
            const matches = await github.rest.git.listMatchingRefs({
              owner, repo, ref
            });
            const existing = matches.data.find(
              item => item.ref === 'refs/' + ref
            );

            if (existing) {
              await github.rest.git.updateRef({
                owner, repo, ref, sha: context.sha, force: true
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/' + ref, sha: context.sha
              });
            }

      - name: Publish or refresh the stable preview APK release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: padalab-preview
          name: PadLab Android Preview — main
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          files: |
            release/padalab-android-arm64-debug.apk
            release/padalab-android-arm64-debug.apk.sha256
