name: Flutter quality and preview builds

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"
  push:
    branches:
      - main
      - feat/flutter-android-foundation
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"

permissions:
  contents: write

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate Android and Web host projects
        run: flutter create . --platforms=android,web --org org.phfi.cdlr --project-name padalab_android --no-pub

      - name: Resolve and lock dependencies
        run: flutter pub get

      - name: Apply Dart formatter
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build debug Android APK
        run: flutter build apk --debug

      - name: Build Flutter Web preview
        run: flutter build web --release --base-href /

      - name: Verify web output
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -d build/web/assets

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: padalab-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Flutter Web preview
        uses: actions/upload-artifact@v4
        with:
          name: padalab-flutter-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Commit formatted sources and dependency lockfile on branch pushes
        if: success() && github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git add lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: apply Dart formatting and lock dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
