name: Flutter quality, Android build and web release

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "scripts/**"
      - "vercel.json"
      - ".github/workflows/flutter-android.yml"
      - "docs/protocol/**"

permissions:
  contents: read
  deployments: write

concurrency:
  group: flutter-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Format, analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate Android and Web host projects
        run: flutter create . --platforms=android,web --org org.phfi.cdlr --project-name padalab_android --no-pub

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build debug Android APK
        run: flutter build apk --debug

      - name: Build Flutter Web preview
        run: flutter build web --release --base-href /

      - name: Verify web output
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -d build/web/assets

      - name: Configure browser cache revalidation
        run: bash scripts/deploy/configure_web_output.sh build/web

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: padalab-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Flutter Web preview
        uses: actions/upload-artifact@v4
        with:
          name: padalab-flutter-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Check Cloudflare production credentials
        id: cloudflare_config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cloudflare Pages deploy skipped; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository Actions secrets."
          fi

      - name: Deploy Flutter Web to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cloudflare_config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=padalab-kannada-reading --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
