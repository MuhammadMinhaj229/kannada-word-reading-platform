name: Signed Android tablet APK release

on:
  push:
    tags:
      - "padalab-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: padalab-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-apk:
    name: Build and publish signed ARM64 tablet APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Require protected institution signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          names=(ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD)
          for name in "${names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing protected signing secret: ${name}"
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/key.properties android/app/upload-keystore.jks

      - name: Prepare verified offline Kannada font
        run: bash scripts/deploy/prepare_assets.sh

      - name: Generate native Android host
        run: flutter create . --platforms=android --org org.phfi.cdlr --project-name padalab_android --no-pub

      - name: Harden Android host
        run: bash scripts/deploy/configure_android_project.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate source formatting and analysis
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --reporter expanded

      - name: Build signed release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK architecture, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ABI_LIST="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)"
          if [[ "$ABI_LIST" != "arm64-v8a" ]]; then
            echo "Expected arm64-v8a only; found:" >&2
            printf '%s\n' "$ABI_LIST" >&2
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          stat --printf='Signed release APK size: %s bytes\n' "$APK"

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: padalab-android-arm64-signed-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/padalab-v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
